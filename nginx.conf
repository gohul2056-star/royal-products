# ==============================================================================
# Royal Products - High-Concurrency Production Load Balancer Configuration
# Engineered for 10,000+ Concurrent Active Users with Reverse Proxy Caching
# ==============================================================================

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Kernel Directives
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # GZip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting & Connection Concurrency Safeguards
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # Microcache Zone (Ultra-fast RAM cache for Catalog APIs)
    proxy_cache_path /var/cache/nginx/royal levels=1:2 keys_zone=royal_cache:50m max_size=1g inactive=60m use_temp_path=off;

    # Upstream Backend Pool (Horizontal Load Balancing)
    upstream backend_cluster {
        least_conn; # Route traffic to instance with lowest active connections
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name royalproducts.com www.royalproducts.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name royalproducts.com www.royalproducts.com;

        # SSL Configuration (TLS 1.2 & 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Static Assets (Browser Caching + CDN Edge Acceleration)
        location /assets/ {
            alias /app/assets/;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 2. Dynamic Catalog API with Microcaching (Absorbs 10,000 req/sec)
        location /api/products {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Microcache for high-burst traffic
            proxy_cache royal_cache;
            proxy_cache_valid 200 304 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;

            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 50;
        }

        # 3. Admin APIs & Uploads (Bypasses Cache, Protected)
        location /api/admin/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25M;
        }

        # 4. Root Application & HTML Serving
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Health Check for Load Balancer Probes
        location /health {
            proxy_pass http://backend_cluster/health;
            access_log off;
        }
    }
}
